<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alertas Comunales Preventivas — Arauco</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #1a1713; font-family: 'Segoe UI', system-ui, sans-serif; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      height: 44px;
      background: rgba(26,21,14,0.95);
      border-bottom: 1px solid rgba(105,97,88,0.4);
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px;
      backdrop-filter: blur(10px);
    }

    .top-bar-brand {
      font-size: 1.1rem; font-weight: 900; letter-spacing: .12em;
      color: #EA7600; font-style: italic; text-transform: lowercase;
    }

    .top-bar-sep {
      width: 1px; height: 18px;
      background: rgba(105,97,88,0.5);
    }

    .top-bar-title {
      font-size: .8rem; font-weight: 600; letter-spacing: .04em;
      color: rgba(223,209,167,0.75);
      flex: 1;
    }

    .top-bar-back {
      background: none; border: 0.5px solid rgba(93,186,169,0.4);
      border-radius: 7px; padding: 5px 12px;
      color: #5DBAA9; font-size: .75rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
      text-decoration: none; display: flex; align-items: center; gap: 5px;
    }
    .top-bar-back:hover { background: rgba(93,186,169,0.10); }

    #mapa {
      position: fixed;
      top: 44px; left: 0; right: 0; bottom: 0;
      width: 100%; height: calc(100% - 44px);
      border: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="top-bar-brand">arauco</span>
    <div class="top-bar-sep"></div>
    <span class="top-bar-title">Alertas Comunales Preventivas</span>
    <a class="top-bar-back" href="/">← Volver</a>
  </div>

  <iframe
    id="mapa"
    src="https://www.arcgis.com/apps/dashboards/f2588dc1601f424cab7c4c8eb7c8d502"
    allowfullscreen
    loading="lazy"
    title="Alertas Comunales Preventivas"
  ></iframe>

</body>
</html>
