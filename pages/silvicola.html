<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plataforma Silvícola — Portal Meteorológico ARAUCO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <style>
    :root {
      --naranja: #EA7600;
      --verde:   #BFB800;
      --corteza: #696158;
      --dark:    #1A1713;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* ── Top bar ── */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: 64px;
      background: rgba(26,23,19,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(105,97,88,0.22);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 64px;
    }
    .top-bar-left { display: flex; align-items: center; gap: 20px; }
    .top-bar-brand {
      font-family: 'Manrope', sans-serif;
      font-size: 1.05rem; font-weight: 800; font-style: italic;
      color: var(--naranja);
    }
    .top-bar-sep {
      width: 1px; height: 20px;
      background: rgba(105,97,88,0.45);
    }
    .top-bar-section {
      display: flex; align-items: center; gap: 8px;
    }
    .top-bar-section .material-symbols-outlined {
      font-size: 18px; color: var(--verde);
    }
    .top-bar-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem; font-weight: 500; letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .top-bar-back {
      display: flex; align-items: center; gap: 6px;
      background: none;
      border: 1px solid rgba(191,184,0,0.35);
      border-radius: 6px;
      padding: 7px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem; font-weight: 600; letter-spacing: .04em;
      color: var(--verde);
      text-decoration: none;
      transition: background .15s;
    }
    .top-bar-back:hover { background: rgba(191,184,0,0.10); }
    .top-bar-back .material-symbols-outlined { font-size: 16px; }

    /* ── PIN gate ── */
    #pin-gate {
      position: fixed;
      top: 64px; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--dark);
      z-index: 40;
    }
    .pin-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(191,184,0,0.18);
      border-radius: 16px;
      padding: 40px 48px;
      display: flex; flex-direction: column; align-items: center; gap: 28px;
      width: 340px;
    }
    .pin-icon {
      font-size: 40px;
      color: var(--verde);
    }
    .pin-heading {
      font-family: 'Manrope', sans-serif;
      font-size: 1.15rem; font-weight: 700;
      color: #fff;
      text-align: center;
    }
    .pin-sub {
      font-size: .8rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
      margin-top: -16px;
    }
    .pin-dots {
      display: flex; gap: 14px;
    }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(191,184,0,0.45);
      background: transparent;
      transition: background .15s, border-color .15s;
    }
    .pin-dot.filled {
      background: var(--verde);
      border-color: var(--verde);
    }
    .pin-dot.error {
      background: #e05252;
      border-color: #e05252;
    }
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }
    .pin-key {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(105,97,88,0.3);
      border-radius: 10px;
      padding: 16px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem; font-weight: 600;
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      transition: background .12s, border-color .12s;
      text-align: center;
    }
    .pin-key:hover { background: rgba(191,184,0,0.12); border-color: rgba(191,184,0,0.4); }
    .pin-key:active { background: rgba(191,184,0,0.22); }
    .pin-key.del {
      color: rgba(255,255,255,0.45);
      font-size: .9rem;
    }
    .pin-key.empty { visibility: hidden; pointer-events: none; }
    .pin-error-msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem; font-weight: 600; letter-spacing: .04em;
      color: #e05252;
      height: 18px;
      text-align: center;
    }

    /* ── Iframe (oculto hasta autenticarse) ── */
    #dashboard-silvicola {
      position: fixed;
      top: 64px; left: 0; right: 0; bottom: 0;
      width: 100%; height: calc(100% - 64px);
      border: none;
      display: none;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .top-bar { padding: 0 20px; }
      .top-bar-sep, .top-bar-section { display: none; }
      .pin-card { width: 90%; padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="top-bar-left">
      <span class="top-bar-brand">Portal Meteorológico ARAUCO</span>
      <div class="top-bar-sep"></div>
      <div class="top-bar-section">
        <span class="material-symbols-outlined">forest</span>
        <span class="top-bar-title">Plataforma Silvícola</span>
      </div>
    </div>
    <a class="top-bar-back" href="/">
      <span class="material-symbols-outlined">arrow_back</span>
      Volver
    </a>
  </header>

  <!-- PIN Gate -->
  <div id="pin-gate">
    <div class="pin-card">
      <span class="material-symbols-outlined pin-icon">lock</span>
      <div>
        <div class="pin-heading">Acceso restringido</div>
        <div class="pin-sub">Ingresa el PIN para continuar</div>
      </div>
      <div class="pin-dots" id="pinDots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>
      <div class="pin-error-msg" id="pinError"></div>
      <div class="pin-keypad">
        <button class="pin-key" onclick="presionarTecla('1')">1</button>
        <button class="pin-key" onclick="presionarTecla('2')">2</button>
        <button class="pin-key" onclick="presionarTecla('3')">3</button>
        <button class="pin-key" onclick="presionarTecla('4')">4</button>
        <button class="pin-key" onclick="presionarTecla('5')">5</button>
        <button class="pin-key" onclick="presionarTecla('6')">6</button>
        <button class="pin-key" onclick="presionarTecla('7')">7</button>
        <button class="pin-key" onclick="presionarTecla('8')">8</button>
        <button class="pin-key" onclick="presionarTecla('9')">9</button>
        <button class="pin-key empty"></button>
        <button class="pin-key" onclick="presionarTecla('0')">0</button>
        <button class="pin-key del" onclick="borrarUltimo()">⌫</button>
      </div>
    </div>
  </div>

  <iframe
    id="dashboard-silvicola"
    src="about:blank"
    allowfullscreen
    title="Plataforma Silvícola — Gestión y Optimización de Masas Forestales"
  ></iframe>

  <script>
    const PIN_CORRECTO = '1234';
    const SESSION_KEY  = 'silv_access';
    let pinActual = '';

    function actualizarDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('d' + i);
        dot.classList.toggle('filled', i < pinActual.length);
        dot.classList.remove('error');
      }
    }

    function presionarTecla(digit) {
      if (pinActual.length >= 4) return;
      pinActual += digit;
      actualizarDots();
      document.getElementById('pinError').textContent = '';
      if (pinActual.length === 4) validarPin();
    }

    function borrarUltimo() {
      pinActual = pinActual.slice(0, -1);
      actualizarDots();
      document.getElementById('pinError').textContent = '';
    }

    function validarPin() {
      if (pinActual === PIN_CORRECTO) {
        sessionStorage.setItem(SESSION_KEY, '1');
        mostrarDashboard();
      } else {
        for (let i = 0; i < 4; i++) document.getElementById('d' + i).classList.add('error');
        document.getElementById('pinError').textContent = 'PIN incorrecto';
        setTimeout(() => { pinActual = ''; actualizarDots(); }, 800);
      }
    }

    function mostrarDashboard() {
      const gate = document.getElementById('pin-gate');
      gate.style.opacity = '0';
      gate.style.transition = 'opacity .3s';
      setTimeout(() => {
        gate.style.display = 'none';
        const iframe = document.getElementById('dashboard-silvicola');
        iframe.src = '/pages/monitor-silvicola.html';
        iframe.style.display = 'block';
      }, 300);
    }

    // Teclado físico
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') presionarTecla(e.key);
      if (e.key === 'Backspace') borrarUltimo();
    });

    // Si ya autenticó en esta sesión, saltar el PIN
    if (sessionStorage.getItem(SESSION_KEY) === '1') mostrarDashboard();
  </script>

</body>
</html>
